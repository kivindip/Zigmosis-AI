<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zigmosis AI — Every Pet Has A Story</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    padding: 40px 24px;
  }
  .hero-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-size: cover;
    background-position: center;
    /* Replace this URL with your own pet photo, e.g. images/hero-dog.jpg */
    background-image: url('images/home.jpg');
  }
  .hero-bg.placeholder {
    background-image: none;
    background: var(--bg-deep);
  }
  .hero-bg.placeholder .fallback-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60vh;
    opacity: 0.06;
  }
  
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
    pointer-events: none;
    z-index: -1;
}
  .brand {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
    opacity: 0;
    animation: rise .8s ease forwards;
  }
  .headline {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(40px, 8vw, 88px);
    line-height: 1.02;
    margin: 0;
    font-style: italic;
    color: var(--cream);
    text-shadow: 0 4px 30px rgba(0,0,0,0.35);
    opacity: 0;
    animation: rise .9s ease .15s forwards;
  }
  .subline {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: clamp(15px, 2.4vw, 19px);
    color: var(--cream-dim);
    letter-spacing: 0.01em;
    max-width: 420px;
    margin-top: 26px;
    opacity: 0;
    animation: rise .9s ease .45s forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .scroll-cta {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--cream-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 8px); }
  }
  .explore-btn {
    margin-top: 34px;
    opacity: 0;
    animation: rise .9s ease .6s forwards;
  }
</style>
</head>
<body>

<div class="hero-bg" id="heroBg"><div class="fallback-icon">🐕</div></div>

<div class="hero">
  <div class="brand">Zigmosis AI</div>
  <h1 class="headline">Every Pet Has<br>A Story</h1>
  <p class="subline">Smart Digital Identity<br>For Your Beloved Pets</p>

  <a href="about.html" class="btn btn-primary explore-btn">Explore →</a>

  <a href="about.html" class="scroll-cta" aria-label="Learn more">
    <span>↓</span>
  </a>
</div>

<script>
  // Check if the background photo actually loads; fall back gracefully if not.
  const img = new Image();
  img.onerror = () => document.getElementById('heroBg').classList.add('placeholder');
  img.src = 'images/home.jpg';
</script>

</body>
</html>
