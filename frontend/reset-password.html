
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Zigmosis AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<style>
    body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Arial, sans-serif;
    }

    .register-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        box-sizing: border-box;
    }

    #newPasswordForm {
        width: 100%;
        max-width: 440px;
        box-sizing: border-box;
        background: #ffffff;
        padding: 24px;
        border: none;
        border-radius: 0;
        box-shadow: none;
    }

    #newPasswordForm h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 12px;
    }

    #newPasswordForm p {
        text-align: center;
        color: #555555;
        line-height: 1.6;
    }

    #newPasswordForm label {
        display: block;
        margin: 18px 0 8px;
        font-size: 15px;
        color: #111111;
    }

    #newPasswordForm input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border: 1px solid #999999;
        border-radius: 4px;
        background: #ffffff;
        color: #111111;
        font-size: 15px;
    }

    #newPasswordForm input:focus {
        outline: 2px solid #111111;
        outline-offset: 2px;
    }

    #newPasswordForm button {
        width: 100%;
        margin-top: 28px;
        padding: 15px;
        background: #111111;
        color: #ffffff;
        border: 1px solid #111111;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    #newPasswordForm button:hover {
        background: #333333;
    }

    #newPasswordForm a {
        color: #111111;
        font-weight: bold;
        text-decoration: underline;
    }

    #resetMessage {
        overflow-wrap: anywhere;
        font-size: 14px;
    }

    @media (max-width: 480px) {
        #newPasswordForm {
            padding: 12px;
        }

        #newPasswordForm h1 {
            font-size: 30px;
        }
    }
</style>


<body>
    <main class="register-page">
        <form class="form-card" id="newPasswordForm">
            <h1>Reset Password</h1>
            <p>Enter your new password below.</p>

            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                minlength="8"
                required
                placeholder="Enter your new password"
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                minlength="8"
                required
                placeholder="Confirm your new password"
            >

            <button type="submit">Update Password</button>
            <p id="resetMessage" role="status"></p>
            <p><a href="login.html">Back to Login</a></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
