<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zigmosis AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<style>
    body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Arial, sans-serif;
    }

    .register-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        box-sizing: border-box;
    }

    #loginForm {
        width: 100%;
        max-width: 440px;
        box-sizing: border-box;
        background: #ffffff;
        padding: 24px;
        border: none;
        border-radius: 0;
        box-shadow: none;
    }

    #loginForm h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 12px;
    }

    #loginForm .sub {
        text-align: center;
        color: #555555;
        margin-bottom: 28px;
    }

    #loginForm label {
        display: block;
        margin: 18px 0 8px;
        font-size: 15px;
        color: #111111;
    }

    #loginForm input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border: 1px solid #999999;
        border-radius: 4px;
        background: #ffffff;
        color: #111111;
        font-size: 15px;
    }

    #loginForm input:focus {
        outline: 2px solid #111111;
        outline-offset: 2px;
    }

    #loginForm button {
        width: 100%;
        margin-top: 28px;
        padding: 15px;
        background: #111111;
        color: #ffffff;
        border: 1px solid #111111;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    #loginForm button:hover {
        background: #333333;
    }

    #loginForm a {
        color: #111111;
        font-weight: bold;
        text-decoration: underline;
    }

    #loginMessage {
        overflow-wrap: anywhere;
        font-size: 14px;
    }

    @media (max-width: 480px) {
        #loginForm {
            padding: 12px;
        }

        #loginForm h1 {
            font-size: 30px;
        }
    }
    
.forgot-password {
    text-align: right;
    margin-top: 10px;
}

.forgot-password a {
    color: #191819;
    font-size: 14px;
    font-weight: normal;
    text-decoration: none;
}

.forgot-password a:hover {
    color: #f3ecf0;
    text-decoration: underline;
}

</style>


<body>

    <main class="register-page">
        <form class="form-card" id="loginForm">
            <h1>🐾 Welcome Back</h1>
            <p class="sub">Login to your Zigmosis AI account</p>

            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter your password">
            <div class="forgot-password">
    <a href="forgot-password.html">Forgot password?</a>
</div>

            <button type="submit">Login</button>

            <p id="loginMessage"></p>

            <p class="sub">
                Don't have an account?
                <a href="signup.html">Sign up here</a>
            </p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
