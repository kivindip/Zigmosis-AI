
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Zigmosis AI</title>
    <link rel="stylesheet" href="responsive.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        .signup-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .signup-form {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #999999;
            border-radius: 4px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #111111;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333333;
        }

        .bottom-text {
            text-align: center;
            margin-top: 25px;
        }

        a {
            color: #111111;
            font-weight: bold;
        }

        #signupMessage {
            overflow-wrap: anywhere;
            font-size: 14px;
        }
        .forgot-password {
    text-align: right;
    margin-top: 8px;
    margin-bottom: 20px;
}

.forgot-password a {
    color: #020102;
    font-size: 14px;
    text-decoration: none;
}

.forgot-password a:hover {
    color: #f0e9ed;
    text-decoration: underline;
}
    </style>
</head>

<body>
    <main class="signup-container">
        <form class="signup-form" id="signupForm">
            <h1>Create Account</h1>
            <p class="subtitle">Join the Zigmosis AI community</p>

            <label for="signupEmail">Email Address</label>
            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
            >

            <label for="signupPassword">Password</label>
            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                minlength="6"
                required
            >
            <div class="forgot-password">
    <a href="forgot-password.html">Forgot password?</a>
</div>

            <button type="submit">Create Account</button>

            <p id="signupMessage" role="status"></p>

            <p class="bottom-text">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
